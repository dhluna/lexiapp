name: CI

on:
  pull_request:
  push:
    branches: [master]

# Solo lectura: los PR de forks nunca reciben secretos ni permisos de escritura.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pruebas, tipos, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Sin NEXT_PUBLIC_SUPABASE_*: también comprueba que la app funciona sin cuentas.
      - run: npm run build

  sql:
    name: Reglas SQL (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:sql
